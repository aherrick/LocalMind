name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      VERSION: 1.0.${{ github.run_number }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Velopack
        run: dotnet tool install --global vpk

      - name: Publish application
        run: dotnet publish LocalMind.csproj --configuration Release --runtime win-x64 --self-contained true --output publish -p:Version=$env:VERSION

      - name: Package with Velopack
        run: vpk pack --packId LocalMind --packVersion $env:VERSION --packDir publish --mainExe LocalMind.exe --outputDir release

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v$env:VERSION release/* --title v$env:VERSION --generate-notes
